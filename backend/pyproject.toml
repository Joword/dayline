[project]
name = "dayline-backend"
version = "0.1.0"
description = "Dayline daily-report agent: API, worker, and the `dl` CLI"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.9,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pymongo>=4.13",
    "typer>=0.15",
    "rich>=13",
    "pyyaml>=6.0",
    "jsonschema>=4.23",   # output validation for team/user skills (schema.json; no Python allowed there)
    "httpx>=0.27",        # git / calendar integrations (the Anthropic SDK uses httpx2 internally)
    "cryptography>=43",   # app-level encryption of integration credentials
    "icalendar>=6",
    "recurring-ical-events>=3",
    "dingtalk-stream>=0.24",  # DingTalk Stream mode (bot without a public callback URL)
    "mcp>=2.3,<3",            # member tools (M7): MCP client; also the Python tool template's server
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
dl = "app.cli.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
