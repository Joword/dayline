endpoints:
  - name: anthropic-direct
    adapter: anthropic
    proxy: none                          # strictly direct; ignores HTTP(S)_PROXY
    api_key_env: ANTHROPIC_API_KEY
    models: {small: claude-haiku-5-5, large: claude-sonnet-5-5}   # use whatever models your account has
    max_data_level: L3
    features: {tool_calling: true, json_schema: true, streaming: true, prompt_caching: true, effort: true}
    # Server-side refusal fallback (beta) for the large model; Haiku 5.5 has none.
    server_fallback_models: [claude-sonnet-5-5]

  - name: anthropic-via-proxy
    adapter: anthropic
    proxy: ${DAYLINE_LLM_PROXY:-http://proxy.corp:8080}
    api_key_env: ANTHROPIC_API_KEY
    models: {small: claude-haiku-5-5, large: claude-sonnet-5-5}
    max_data_level: L3
    features: {tool_calling: true, json_schema: true, streaming: true, prompt_caching: true, effort: true}
    server_fallback_models: [claude-sonnet-5-5]

  - name: corp-gateway                    # corp LLM gateway; forwards only to intranet models
    adapter: anthropic                    # or openai_compat, for a gateway that speaks Chat Completions
    base_url: ${DAYLINE_CORP_LLM_URL:-https://llm.corp.internal}
    api_key_env: CORP_LLM_API_KEY
    auth_header: x-api-key                # bearer | x-api-key
    # Names and capabilities stay out of git. Unset values load as unknown and this endpoint stays off.
    models:
      small: ${DAYLINE_CORP_MODEL_SMALL:-TODO}
      large: ${DAYLINE_CORP_MODEL_LARGE:-TODO}
    max_data_level: L3                    # data stays inside the intranet
    max_context: ${DAYLINE_CORP_MAX_CONTEXT:-TODO}
    features:
      tool_calling: ${DAYLINE_CORP_TOOL_CALLING:-TODO}
      json_schema: ${DAYLINE_CORP_JSON_SCHEMA:-TODO}
      streaming: ${DAYLINE_CORP_STREAMING:-TODO}
      prompt_caching: false
      effort: false
    max_tool_turns: 1                     # lower tool budget on the backup endpoint
    prompt_variant: corp                  # uses prompt.<lang>.corp.md where a skill provides one

  # OpenAI-compatible endpoint (OpenAI, vLLM, or another Chat Completions server).
  # Uncomment, set the key in OPENAI_API_KEY, and add the name to failover.order.
  # - name: openai
  #   adapter: openai_compat
  #   base_url: https://api.openai.com/v1   # include the /v1 prefix the server expects
  #   api_key_env: OPENAI_API_KEY
  #   models: {small: gpt-4.1-mini, large: gpt-4.1}
  #   features: {tool_calling: true, json_schema: true, streaming: true, prompt_caching: false, effort: false}

failover:
  order: [anthropic-direct, anthropic-via-proxy, corp-gateway]
  retry: 2
  backoff_base_s: 0.5
  backoff_max_s: 8
  circuit_breaker: {failures: 3, cooldown_s: 60}

# USD per million tokens, for skill_runs.cost. Check current prices before relying on them.
# Unlisted cache prices default to 0.1x (read) and 1.25x (write) of the input price.
pricing:
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.10}
  claude-haiku-5-5: {input: 0.10, output: 0.50}   # rate for prompts up to 100K tokens
